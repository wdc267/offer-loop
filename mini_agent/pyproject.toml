[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "OfferLoop MiniAgent - a small Harness demo"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
live = ["openai>=1.0", "python-dotenv>=1.0"]
pdf = ["pypdf>=5.0"]
dev = ["pytest>=8.0", "pypdf>=5.0"]

[tool.setuptools.packages.find]
include = ["mini_agent"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
